name: Update stats card

on:
  schedule:
    - cron: "30 18 * * *" # daily, around midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats-card.mjs, .github/workflows/stats-card.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate card
        run: node scripts/stats-card.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg assets/stats-light-wide.svg assets/stats-dark-wide.svg
          git diff --staged --quiet || (git commit -m "chore: update stats card" && git push)
